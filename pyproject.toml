[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "receitas-tradicionais-canonicas"
version = "2.0.0"
description = "Protocolo de pesquisa documentada de receitas tradicionais e adaptação alimentar."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Rodrigo Yú Matsumoto OAB/PE nº 1.338-B"}]
keywords = ["Rodrigo Yú Matsumoto OAB/PE nº 1.338-B", "culinária", "pesquisa", "receitas tradicionais", "MCP"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = ["pydantic==2.14.2", "mcp==2.3.0"]

[project.scripts]
receitas = "receitas_tradicionais.cli:main"
receitas-mcp = "receitas_tradicionais.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
receitas_tradicionais = ["INSTRUCAO_PROJETO.md"]

[tool.receitas_tradicionais.metadata]
lang = "pt-BR"
author = "Rodrigo Yú Matsumoto OAB/PE nº 1.338-B"
manager = "Rodrigo Yú Matsumoto OAB/PE nº 1.338-B"
title = "Receitas tradicionais canônicas"
subject = "Pesquisa culinária documentada e adaptação alimentar com revisão humana"
