name: Verificação do projeto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o pacote
        run: python -m pip install .
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Conferir exemplos, metadados e manifest
        run: python scripts/validate_repository.py
